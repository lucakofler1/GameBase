<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f5f7;--card:#fff;--ink:#1d1d1f;--mut:#6e6e73;--line:#e3e3e8;--acc:#0071e3;--soft:#f0f0f4;--red:#ff3b30;--grn:#34c759;--yel:#ffb800;--gry:#8e8e93;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--ink:#f5f5f7;--mut:#98989d;--line:#2c2c2e;--soft:#2a2a2d;--acc:#0a84ff;--gry:#48484a;--sh:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
h1,h2,h3{letter-spacing:-.02em;margin:0}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:12px;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center;color:#fff;font-style:normal;font-size:16px}
.tabs{display:flex;gap:4px;margin-left:auto;background:var(--soft);padding:3px;border-radius:12px}
.tab{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:500;color:var(--mut);position:relative;white-space:nowrap}
.tab.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab .dot{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.iconbtn{border:0;background:var(--soft);width:36px;height:36px;border-radius:50%;cursor:pointer;font-weight:700;flex:none}
.me{position:relative}
.menu{position:absolute;right:0;top:44px;background:var(--card);border-radius:14px;box-shadow:var(--sh);border:1px solid var(--line);padding:6px;min-width:210px;z-index:30}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer}
.menu button:hover{background:var(--soft)}
.menu .who{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px;color:var(--mut)}
main{padding:26px 0 70px}
.h1{font-size:32px;font-weight:700;margin-bottom:4px}
.sub{color:var(--mut);margin-bottom:22px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.btn{border:0;border-radius:12px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--acc);color:#fff;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.inp{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;outline:none}

label.l{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:500}
.sec-t{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:26px 0 10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--soft);color:var(--mut)}
.pill.grn{background:color-mix(in srgb,var(--grn) 16%,transparent);color:#1f9d43}
.pill.red{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.blu{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.pill.yel{background:color-mix(in srgb,var(--yel) 20%,transparent);color:#a77800}
.empty{color:var(--mut);text-align:center;padding:26px;border:1.5px dashed var(--line);border-radius:var(--r)}
.dcard{cursor:pointer;transition:transform .15s}
.dcard:hover{transform:translateY(-2px)}
.dhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.gico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none}
.gico.w{background:linear-gradient(135deg,#34c759,#30b0c7);color:#fff}
.gico.c{background:linear-gradient(135deg,#ff9f0a,#ff375f);color:#fff}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;font-size:14px}
.prow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;flex:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login .card{width:100%;max-width:380px;padding:32px}
.login .logo{justify-content:center;font-size:26px;margin-bottom:6px}
.login .logo i{width:44px;height:44px;font-size:24px;border-radius:13px}
.credit{text-align:center;color:var(--mut);font-size:12px;margin-top:18px}
/* Duel view */
.duel{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media (max-width:820px){.duel{grid-template-columns:1fr}.side{order:-1}}
.board{display:grid;gap:6px;justify-content:center;margin:8px auto 18px}
.brow{display:grid;gap:6px}
.tile{width:54px;height:54px;border:2px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:24px;font-weight:700;text-transform:uppercase;background:var(--card)}

.tile.f{border-color:var(--mut)}

.tile.pop{animation:pop .12s}
.brow.shake{animation:shake .4s}

.kr{display:flex;gap:5px;justify-content:center}
.key{flex:1;max-width:44px;height:52px;border:0;border-radius:8px;background:var(--soft);font-weight:600;cursor:pointer;text-transform:uppercase;font-size:15px}
.key.wide{max-width:70px;flex:1.5;font-size:12px}
.key.g{background:var(--grn);color:#fff}.key.y{background:var(--yel);color:#fff}.key.x{background:var(--gry);color:#fff;opacity:.85}
.clin{display:flex;gap:8px;max-width:520px;margin:0 auto 16px}
.glist{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.gitem{position:relative;border-radius:11px;background:var(--soft);overflow:hidden;display:flex;justify-content:space-between;padding:10px 14px;font-weight:600}

.gitem.last{outline:2px solid var(--acc)}
.side .card{position:sticky;top:76px}
.lrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .meta{font-size:12px;color:var(--mut)}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.banner{border-radius:var(--r);padding:16px 18px;margin-bottom:16px;font-weight:500}
.banner.win{background:linear-gradient(135deg,#ffd60a33,#ff9f0a33)}
.banner.info{background:color-mix(in srgb,var(--acc) 12%,transparent)}
/* choose */
.choice{border:2px solid var(--line);border-radius:var(--r);padding:18px;cursor:pointer;background:var(--card);text-align:left;width:100%}
.choice.on{border-color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 15%,transparent)}
.choice b{display:block;font-size:17px;margin:10px 0 4px}
.choice small{color:var(--mut)}
.lens{display:flex;gap:6px;flex-wrap:wrap}
.lens button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;width:44px;height:40px;font-weight:600;cursor:pointer}
.lens button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.uchk{display:flex;align-items:center;gap:9px;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;cursor:pointer;background:var(--card)}
.uchk.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,var(--card))}
/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end;margin-bottom:18px}
.pod{text-align:center;border-radius:var(--r);padding:16px 8px;background:var(--card);box-shadow:var(--sh)}
.pod .m{font-size:30px}.pod .nm{font-weight:700;margin-top:4px}.pod .w{color:var(--mut);font-size:13px}
.pod.p1{padding-top:26px;background:linear-gradient(180deg,#ffd60a2a,var(--card))}
/* modal / toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--card);border-radius:22px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{margin-bottom:10px}
.modal h3{font-size:16px;margin:18px 0 6px}
.modal p,.modal li{color:var(--ink)}
.modal .mut{color:var(--mut)}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:500;box-shadow:var(--sh);animation:tin .25s}
.toast.err{background:var(--red);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(10px)}}
.invite{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:14px;font-size:14px;margin:10px 0}
.chat{display:grid;grid-template-columns:280px 1fr;gap:14px;height:calc(100vh - 200px);min-height:420px}
.clist{overflow:auto;padding:6px}
.citem{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer}
.citem:hover{background:var(--soft)}
.citem.on{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.citem .pv{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubadge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.cwin{display:flex;flex-direction:column;padding:0;overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmsgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:6px}
.bub{max-width:75%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.bub.me{align-self:flex-end;background:var(--acc);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.btime{font-size:11px;color:var(--mut);margin:4px 6px 2px}

.cform{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}

@media (max-width:700px){.chat{grid-template-columns:1fr;height:calc(100vh - 230px)}.chat.open .clist{display:none}.chat:not(.open) .cwin{display:none}}
.gico.p{background:linear-gradient(135deg,#bf5af2,#5e5ce6);color:#fff}
.gico.s{background:linear-gradient(135deg,#0a84ff,#64d2ff);color:#fff}
.pushes{position:fixed;top:70px;right:16px;z-index:70;display:flex;flex-direction:column;gap:10px;width:340px;max-width:calc(100vw - 32px)}
.push{display:flex;gap:11px;align-items:flex-start;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.18);cursor:pointer;animation:pin .35s cubic-bezier(.2,.9,.3,1.2)}
.push .av{width:36px;height:36px;font-size:15px}
.push b{display:block;font-size:14px}.push .pb{font-size:13px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.push .pa{font-size:11px;color:var(--mut);margin-left:auto;white-space:nowrap}
.push.out{animation:pout .3s forwards}
@keyframes pin{from{opacity:0;transform:translateX(40px)}}
@keyframes pout{to{opacity:0;transform:translateX(40px)}}
.rankb{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;color:#fff}
.rankcard{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.rankcard .ri{font-size:44px}
.prog{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin-top:8px}.prog>div{height:100%;border-radius:6px}
.ranks{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.search{position:relative;margin-bottom:10px}.search input{padding-left:34px}.search:before{content:'🔍';position:absolute;left:11px;top:10px;font-size:14px;opacity:.6}
/* Wer bin ich */
.wcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.wcard{border-radius:16px;padding:14px;background:var(--soft);text-align:center;position:relative}
.wcard.turn{outline:2.5px solid var(--acc)}
.wcard .wn{font-weight:800;font-size:16px;margin-top:6px;letter-spacing:-.01em}
.wcard .av{margin:0 auto}
.wcard.me .wn{font-size:26px}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vote button{padding:18px;font-size:18px;border-radius:16px}
.btn.grn{background:var(--grn)}
.qbox{background:color-mix(in srgb,var(--acc) 8%,var(--card));border:1.5px solid color-mix(in srgb,var(--acc) 30%,transparent);border-radius:18px;padding:18px;margin-bottom:16px}
.qbox .qt{font-size:20px;font-weight:700;margin:4px 0}
.wlog{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.wli{display:flex;gap:8px;align-items:center;font-size:14px;padding:8px 10px;border-radius:12px;background:var(--soft)}
.wli .q{flex:1}
/* Schiffe */
.bsw{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:820px){.bsw{grid-template-columns:1fr}}
.grid10{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;aspect-ratio:1;max-width:400px;margin:0 auto;width:100%}
.cell{border-radius:5px;background:color-mix(in srgb,var(--acc) 10%,var(--soft));display:grid;place-items:center;font-size:13px;font-weight:700;border:0;padding:0;color:#fff;aspect-ratio:1}
button.cell{cursor:pointer}button.cell:hover{background:color-mix(in srgb,var(--acc) 30%,var(--soft))}
.cell.ship{background:#8e8e93}

.cell.sunk{background:#ff3b30}.cell.sunk:after{content:'✕'}
.cell.last{outline:2.5px solid var(--acc)}
.bst{text-align:center;font-weight:700;margin-bottom:8px}
.legend{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.tab .s{display:none}
@media (max-width:700px){.tab .l{display:none}.tab .s{display:inline}.pushes{top:12px;right:12px;left:12px;width:auto;max-width:none}}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px 0 30px}
@media (max-width:700px){.tabs{position:fixed;bottom:0;left:0;right:0;border-radius:0;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);z-index:25}.tab{flex:1;font-size:13px;padding:8px 4px}main{padding-bottom:110px}.h1{font-size:26px}.bar .spacer{flex:1}}
</style>

<script>
// ===================== Konfiguration =====================
const SUPABASE_URL = 'https://sjecnlygoqpsjdwdpjma.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WU9z2-SyDBnLEX_JlqMJOQ_HE2U8eG3';
const EMAIL_DOMAIN = '@wortduell.local';
const SITE_URL = location.origin + location.pathname.replace(/index\.html$/, '');

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { storageKey: 'wortduell-auth', persistSession: true } });

// ===================== Zustand =====================
const S = { me: null, profile: null, tab: 'duels', users: [], duels: [], players: [], openDuel: null, myGuesses: [], wl: null, draft: '', menu: false, newDuel: { game: 'wordless', len: 5, opp: new Set() }, board: [], adminData: null, lastInvites: null, msgs: [], chatWith: null, msgDraft: {}, friends: [], fq: '', cq: '', wbi: null, bs: null, bsDraft: null, lb: null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const COLORS = ['#0a84ff', '#30b0c7', '#34c759', '#ff9f0a', '#ff375f', '#bf5af2', '#5e5ce6', '#ff6482', '#64d2ff', '#ac8e68'];
const colorFor = id => { let h = 0; for (const c of String(id)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };
const user = id => S.users.find(u => u.id === id) || { display_name: 'Gelöschter Benutzer', username: '?', id };
const av = id => { const u = user(id); return `<span class="av" style="background:${colorFor(id)}">${esc((u.display_name || '?')[0].toUpperCase())}</span>`; };
const toast = (msg, err) => { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200); };
const errMsg = e => (e && (e.message || e.error_description)) || String(e);
const genPw = () => { const a = 'abcdefghjkmnpqrstuvwxyz', d = '23456789'; let s = ''; for (let i = 0; i < 6; i++) s += a[Math.floor(Math.random() * a.length)]; for (let i = 0; i < 3; i++) s += d[Math.floor(Math.random() * d.length)]; return s; };
const fmtDate = t => t ? new Date(t).toLocaleString('de-AT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
const GAME = {
  wordless: { name: 'Wordless', ico: 'W', cls: 'w', unit: 'Versuche', desc: 'Errate das Wort in 6 Versuchen – Farben zeigen dir, welche Buchstaben stimmen.' },
  clueless: { name: 'Clueless', ico: '?', cls: 'c', unit: 'Versuche', desc: 'Keine Hinweise: Jedes Wort bekommt einen Rang, wie nah es von der Bedeutung her am geheimen Wort liegt.' },
  werbinich: { name: 'Wer bin ich?', ico: '🎭', cls: 'p', unit: 'Fragen', desc: 'Jeder bekommt eine berühmte Person oder Figur. Stell Ja/Nein-Fragen – die anderen stimmen RICHTIG oder FALSCH ab. Ab 2 Spielern.' },
  schiffe: { name: 'Schiffe versenken', ico: '🚢', cls: 's', unit: 'Schüsse', desc: 'Der Klassiker zu zweit: Flotte platzieren, abwechselnd schießen – wer zuerst alle Schiffe versenkt, gewinnt.' },
};
const RANKS = [
  { min: 0, name: 'Bronze', ico: '🥉', c: '#ac8e68' }, { min: 60, name: 'Silber', ico: '🥈', c: '#8e8e93' }, { min: 150, name: 'Gold', ico: '🥇', c: '#d4a017' },
  { min: 300, name: 'Platin', ico: '💠', c: '#30b0c7' }, { min: 500, name: 'Diamant', ico: '💎', c: '#0a84ff' }, { min: 800, name: 'Meister', ico: '👑', c: '#bf5af2' }, { min: 1200, name: 'Legende', ico: '🔥', c: '#ff375f' }];
const rankOf = pts => [...RANKS].reverse().find(r => pts >= r.min);
const nextRank = pts => RANKS.find(r => r.min > pts);
const rankBadge = pts => { const r = rankOf(pts || 0); return `<span class="rankb" style="background:${r.c}">${r.ico} ${r.name}</span>`; };
const isFriend = id => S.friends.some(f => f.status === 'accepted' && (f.user_a === id || f.user_b === id));
const friendRow = id => S.friends.find(f => f.user_a === id || f.user_b === id);
const incomingReq = () => S.friends.filter(f => f.status === 'pending' && f.requested_by !== S.me.id);
const myFriends = () => S.users.filter(u => u.id !== S.me.id && isFriend(u.id));
const STATUS = { invited: ['Eingeladen', 'yel'], playing: ['Spielt', 'blu'], solved: ['Gelöst', 'grn'], failed: ['Nicht geschafft', 'red'], gave_up: ['Aufgegeben', 'red'], declined: ['Abgelehnt', ''] };

// ===================== Daten =====================
async function loadAll() {
  const [u, dp] = await Promise.all([
    sb.from('profiles').select('id,username,display_name,is_admin,created_at').order('display_name'),
    sb.from('duel_players').select('*'),
  ]);
  if (u.error) throw u.error;
  S.users = u.data || [];
  S.players = dp.data || [];
  const ids = [...new Set(S.players.map(p => p.duel_id))];
  if (ids.length) { const d = await sb.from('duels').select('*').in('id', ids).order('created_at', { ascending: false }); S.duels = d.data || []; } else S.duels = [];
  S.profile = S.users.find(x => x.id === S.me.id) || S.profile;
  await Promise.all([loadMsgs(), loadFriends(), loadLb(), S.openDuel ? loadGameData(S.openDuel) : null]);
  // Zug-Hinweise
  const turns = myTurn().map(d => d.id + ':' + (d.state?.turn || '') + ':' + (d.state?.qid || ''));
  if (S.lastTurns) myTurn().filter(d => !S.lastTurns.includes(d.id + ':' + (d.state?.turn || '') + ':' + (d.state?.qid || '')) && ['werbinich', 'schiffe'].includes(d.game) && S.openDuel !== d.id)
    .forEach(d => push({ uid: d.created_by, title: GAME[d.game].name, body: turnInfo(d).label, onclick: () => openDuel(d.id) }));
  S.lastTurns = turns;
  // neue Einladungen melden
  const inv = myInvites().map(d => d.id);
  if (S.lastInvites) inv.filter(i => !S.lastInvites.includes(i)).forEach(i => { const d = S.duels.find(x => x.id === i); push({ uid: d?.created_by, title: `⚔️ ${user(d?.created_by).display_name} fordert dich heraus`, body: `${GAME[d?.game]?.name || 'Duell'} – tippe zum Annehmen`, onclick: () => openDuel(i) }); notify('Neue Duell-Einladung', `${user(d?.created_by).display_name} fordert dich heraus!`); });
  S.lastInvites = inv;
}
let msgsInit = false;
async function loadMsgs() {
  const { data, error } = await sb.from('messages').select('*').order('created_at', { ascending: true }).limit(2000);
  if (error) return;
  const old = new Set(S.msgs.map(m => m.id));
  if (msgsInit) data.filter(m => !old.has(m.id) && m.to_id === S.me.id).forEach(m => {
    if (!(S.tab === 'chat' && S.chatWith === m.from_id && !S.openDuel && !document.hidden)) { push({ uid: m.from_id, title: user(m.from_id).display_name, body: m.body, onclick: () => openChat(m.from_id) }); notify('Neue Nachricht von ' + user(m.from_id).display_name, m.body.slice(0, 120)); }
  });
  S.msgs = data; msgsInit = true;
}
let friendsInit = false;
async function loadFriends() {
  const { data, error } = await sb.from('friendships').select('*'); if (error) return;
  if (friendsInit) {
    const old = S.friends;
    data.filter(f => f.status === 'pending' && f.requested_by !== S.me.id && !old.some(o => o.user_a === f.user_a && o.user_b === f.user_b))
      .forEach(f => push({ uid: f.requested_by, title: `👋 ${user(f.requested_by).display_name}`, body: 'möchte mit dir befreundet sein', onclick: () => { S.openDuel = null; S.tab = 'friends'; render(); } }));
    data.filter(f => f.status === 'accepted' && f.requested_by === S.me.id && old.some(o => o.user_a === f.user_a && o.user_b === f.user_b && o.status === 'pending'))
      .forEach(f => { const o = f.user_a === S.me.id ? f.user_b : f.user_a; push({ uid: o, title: `🤝 ${user(o).display_name}`, body: 'hat deine Freundschaftsanfrage angenommen', onclick: () => openChat(o) }); });
  }
  S.friends = data; friendsInit = true;
}
async function loadLb() { const { data } = await sb.rpc('leaderboard'); if (data) S.lb = data; }
const myPoints = () => (S.lb || []).find(x => x.user_id === S.me.id)?.points || 0;
function push({ uid, title, body, onclick }) {
  let box = $('#pushes'); if (!box) { box = document.createElement('div'); box.id = 'pushes'; box.className = 'pushes'; document.body.appendChild(box); }
  const el = document.createElement('div'); el.className = 'push';
  el.innerHTML = `${uid ? av(uid) : ''}<div style="flex:1;min-width:0"><div class="row" style="gap:6px;flex-wrap:nowrap"><b>${esc(title)}</b><span class="pa">jetzt</span></div><div class="pb">${esc(body)}</div></div>`;
  const close = () => { el.classList.add('out'); setTimeout(() => el.remove(), 300); };
  el.onclick = () => { close(); onclick && onclick(); };
  box.prepend(el); while (box.children.length > 4) box.lastChild.remove();
  setTimeout(close, 7000);
}
function turnInfo(d) {
  const me = myRow(d.id); const st = d.state || {};
  if (!me || d.status !== 'open') return { mine: false };
  if (me.status === 'invited') return { mine: false, label: 'Einladung' };
  if (me.status !== 'playing') return { mine: false, label: 'Warte auf andere' };
  if (d.game === 'werbinich') {
    if (st.phase === 'lobby') return d.created_by === S.me.id ? { mine: true, label: 'Spiel starten' } : { mine: false, label: 'Warte auf Start' };
    if (st.qid && st.turn !== S.me.id) return { mine: true, label: `Abstimmen: ${user(st.turn).display_name} fragt` };
    return st.turn === S.me.id ? { mine: true, label: 'Du bist dran – stell eine Frage' } : { mine: false, label: `${user(st.turn).display_name} ist dran` };
  }
  if (d.game === 'schiffe') {
    if (st.phase === 'place') return (st.ready || []).includes(S.me.id) ? { mine: false, label: 'Warte auf Gegner' } : { mine: true, label: 'Schiffe platzieren' };
    return st.turn === S.me.id ? { mine: true, label: 'Du bist dran – schieß!' } : { mine: false, label: `${user(st.turn).display_name} ist dran` };
  }
  return { mine: true, label: 'Du bist dran' };
}
const unreadFrom = id => S.msgs.filter(m => m.to_id === S.me.id && m.from_id === id && !m.read_at).length;
const unreadTotal = () => S.msgs.filter(m => m.to_id === S.me.id && !m.read_at).length;
const playersOf = id => S.players.filter(p => p.duel_id === id);
const myRow = id => S.players.find(p => p.duel_id === id && p.user_id === S.me.id);
const myInvites = () => S.duels.filter(d => d.status === 'open' && myRow(d.id)?.status === 'invited');
const myTurn = () => S.duels.filter(d => d.status === 'open' && myRow(d.id)?.status === 'playing' && turnInfo(d).mine);
function notify(title, body) { try { if ('Notification' in window && Notification.permission === 'granted' && document.hidden) new Notification(title, { body }); } catch (e) { } }

async function loadWordList() {
  if (S.wl) return S.wl;
  const r = await fetch('data/wordless.json'); const j = await r.json();
  S.wl = {}; for (const k in j.valid) S.wl[k] = new Set([...j.valid[k], ...(j.answers[k] || [])]);
  return S.wl;
}

let rtChannel = null, pollT = null, refreshT = null;
function startLive() {
  if (rtChannel) sb.removeChannel(rtChannel);
  rtChannel = sb.channel('wd-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'duel_players' }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'duels' }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'messages' }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'wbi_questions' }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'wbi_votes' }, scheduleRefresh)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'bs_shots' }, scheduleRefresh)
    .subscribe();
  clearInterval(pollT); pollT = setInterval(() => { if (!document.hidden) refresh(); }, 6000);
}
function scheduleRefresh() { clearTimeout(refreshT); refreshT = setTimeout(refresh, 250); }
async function refresh() { try { await loadAll(); render(true); } catch (e) { console.warn(e); } }

// ===================== Auth =====================
async function boot() {
  if (SUPABASE_URL.startsWith('__')) { $('#app').innerHTML = `<div class="login"><div class="card"><div class="logo"><i>W</i>Wort-Duell</div><p class="sub" style="text-align:center">Die Datenbank ist noch nicht verbunden.</p></div></div>`; return; }
  const { data } = await sb.auth.getSession();
  if (data.session) await enter(data.session.user); else renderLogin();
  sb.auth.onAuthStateChange((ev, session) => { if (ev === 'SIGNED_OUT') { S.me = null; renderLogin(); } });
}
function renderLogin(msg) {
  $('#app').innerHTML = `<div class="login"><form class="card" id="lf">
    <div class="logo"><i>W</i>Wort-Duell</div>
    <p class="sub" style="text-align:center;margin-bottom:8px">Wordless &amp; Clueless gegen deine Freunde</p>

    <button class="btn" style="width:100%;margin-top:18px" id="lb">Anmelden</button>
    <p class="credit">Zugang bekommst du nur von Luca.<br>Wort-Duell · von Luca Kofler</p>
  </form></div>`;
  $('#lf').onsubmit = async e => {
    e.preventDefault(); $('#lb').disabled = true;

async function enter(u) {
  S.me = u;
  try { await loadAll(); } catch (e) { renderLogin('Fehler beim Laden: ' + errMsg(e)); return; }
  if (!S.profile) { await sb.auth.signOut(); renderLogin('Dieses Konto ist nicht freigeschaltet.'); return; }

  const h = location.hash.match(/^#duell=(.+)$/); if (h) openDuel(h[1]); else render();
}

function render(soft) {

// ---------- Duelle-Übersicht ----------
function duelCard(d) {
  const ps = playersOf(d.id).filter(p => p.status !== 'declined');
  const me = myRow(d.id); const g = GAME[d.game];
  let tag = '';
  if (d.status === 'finished') tag = d.winner_id ? (d.winner_id === S.me.id ? '<span class="pill grn">🏆 Gewonnen</span>' : `<span class="pill">Sieg: ${esc(user(d.winner_id).display_name)}</span>`) : '<span class="pill">Kein Sieger</span>';
  else if (me?.status === 'invited') tag = '<span class="pill yel">Einladung</span>';
  else { const ti = turnInfo(d); tag = `<span class="pill ${ti.mine ? 'blu' : ''}">${esc(ti.label || 'Warte auf andere')}</span>`; }
  return `<div class="card dcard" data-open="${d.id}">
    <div class="dhead"><div class="gico ${g.cls}">${g.ico}</div><div style="flex:1;min-width:0"><b>${g.name}${d.word_length ? ` · ${d.word_length} Buchstaben` : ''}</b><div class="sub" style="margin:0;font-size:13px">von ${esc(user(d.created_by).display_name)} · ${fmtDate(d.created_at)}</div></div>${tag}</div>
    <div class="plist">${ps.map(p => `<div class="prow">${av(p.user_id)}<span class="n">${esc(user(p.user_id).display_name)}${p.user_id === S.me.id ? ' (du)' : ''}</span><span class="pill ${STATUS[p.status][1]}">${STATUS[p.status][0]}</span><b style="width:76px;text-align:right;font-variant-numeric:tabular-nums">${p.attempts} ${d.game === 'wordless' ? '/ 6' : GAME[d.game].unit}</b></div>`).join('')}</div>
    ${me?.status === 'invited' ? `<div class="row" style="margin-top:14px"><button class="btn sm" data-acc="${d.id}">Annehmen &amp; spielen</button><button class="btn sm sec" data-dec="${d.id}">Ablehnen</button></div>` : ''}
  </div>`;
}
function viewDuels() {
  const inv = myInvites(), turn = myTurn();

  const sec = (t, arr, empty) => `<div class="sec-t">${t}</div>${arr.length ? `<div class="grid g2">${arr.map(duelCard).join('')}</div>` : `<div class="empty">${empty}</div>`}`;

// ---------- Neues Duell ----------
function viewNew() {
  const N = S.newDuel; const others = myFriends(); [...N.opp].forEach(id => { if (!isFriend(id)) N.opp.delete(id); });
  const hint = N.game === 'schiffe' ? (N.opp.size !== 1 ? 'Schiffe versenken: genau eine Person einladen.' : '') : N.game === 'werbinich' ? (N.opp.size < 1 ? 'Wer bin ich?: mindestens eine Person einladen.' : '') : '';
  const rule = N.game === 'werbinich' ? 'Gewonnen hat, wer zuerst errät, wer er ist.' : N.game === 'schiffe' ? 'Gewonnen hat, wer zuerst alle gegnerischen Schiffe versenkt.' : 'Gewonnen hat, wer mit den wenigsten Versuchen löst. Bei Gleichstand zählt, wer schneller war.';
  return {
    html: `<div class="h1">Neues Duell</div><div class="sub">Spiel wählen, Freunde einladen, los geht's.</div>
    <div class="grid g2">${Object.entries(GAME).map(([k, g]) => `<button class="choice ${N.game === k ? 'on' : ''}" data-game="${k}"><div class="gico ${g.cls}">${g.ico}</div><b>${g.name}</b><small>${g.desc}</small></button>`).join('')}</div>
    ${N.game === 'wordless' ? `<div class="sec-t">Wortlänge</div><div class="lens">${[3, 4, 5, 6, 7, 8].map(n => `<button data-len="${n}" class="${N.len === n ? 'on' : ''}">${n}</button>`).join('')}</div>` : ''}
    <div class="sec-t">Freunde einladen (${N.opp.size})</div>
    ${others.length ? `<div class="ulist">${others.map(u => `<div class="uchk ${N.opp.has(u.id) ? 'on' : ''}" data-opp="${u.id}">${av(u.id)}<span style="flex:1">${esc(u.display_name)}</span>${N.opp.has(u.id) ? '✓' : ''}</div>`).join('')}</div>` : '<div class="empty">Du hast noch keine Freunde hier. Füge im Tab <b>Freunde</b> Leute hinzu – erst dann kannst du sie einladen.</div>'}
    <div class="row" style="margin-top:22px"><button class="btn" id="start" ${hint ? 'disabled' : ''}>${N.opp.size ? `Duell starten (${N.opp.size + 1} Spieler)` : 'Allein üben'}</button><span style="color:${hint ? 'var(--red)' : 'var(--mut)'};font-size:13px">${hint || rule}</span></div>`,
    bind() {
      document.querySelectorAll('[data-game]').forEach(b => b.onclick = () => { N.game = b.dataset.game; render(); });
      document.querySelectorAll('[data-len]').forEach(b => b.onclick = () => { N.len = +b.dataset.len; render(); });
      document.querySelectorAll('[data-opp]').forEach(b => b.onclick = () => { const id = b.dataset.opp; N.opp.has(id) ? N.opp.delete(id) : N.opp.add(id); render(); });
      $('#start').onclick = async () => {
        $('#start').disabled = true;
        const { data, error } = await sb.rpc('create_duel', { p_game: N.game, p_len: N.game === 'wordless' ? N.len : null, p_invitees: [...N.opp] });

// ----- Wordless -----
function wordlessHtml(d, me) {
  const L = d.word_length, rows = [];
  const canPlay = d.status === 'open' && me?.status === 'playing';
  for (let r = 0; r < 6; r++) {
    const gs = S.myGuesses[r];
    let cells = '';
    for (let c = 0; c < L; c++) {
      if (gs) cells += `<div class="tile ${gs.result.colors[c]}">${esc([...gs.guess][c])}</div>`;
      else if (r === S.myGuesses.length && canPlay) { const ch = [...S.draft][c]; cells += `<div class="tile ${ch ? 'f' : ''}" id="t${c}">${ch ? esc(ch) : ''}</div>`; }
      else cells += '<div class="tile"></div>';
    }
    rows.push(`<div class="brow" ${r === S.myGuesses.length ? 'id="cur"' : ''} style="grid-template-columns:repeat(${L},auto)">${cells}</div>`);
  }
  const ks = {}; const rank = { g: 3, y: 2, x: 1 };
  S.myGuesses.forEach(gs => [...gs.guess].forEach((ch, i) => { const c = gs.result.colors[i]; if (!ks[ch] || rank[c] > rank[ks[ch]]) ks[ch] = c; }));
  const KR = ['qwertzuiopü', 'asdfghjklöä', '⏎yxcvbnm⌫'];
  const kb = canPlay ? `<div class="kb">${KR.map(r => `<div class="kr">${[...r].map(k => k === '⏎' ? '<button class="key wide" data-k="enter">Enter</button>' : k === '⌫' ? '<button class="key wide" data-k="back">⌫</button>' : `<button class="key ${ks[k] || ''}" data-k="${k}">${k}</button>`).join('')}</div>`).join('')}</div>` : '';
  return `<div class="board">${rows.join('')}</div>${kb}`;
}
let keyHandler = null;
function bindWordless(d, me) {
  if (keyHandler) document.removeEventListener('keydown', keyHandler);
  if (!(d.status === 'open' && me?.status === 'playing')) return;
  const L = d.word_length;
  const press = k => {
    if (S.busy) return;
    if (k === 'enter') return submitWordless(d);
    if (k === 'back') S.draft = [...S.draft].slice(0, -1).join('');
    else if (/^[a-zäöü]$/.test(k) && [...S.draft].length < L) S.draft += k;
    for (let c = 0; c < L; c++) { const t = $('#t' + c); if (!t) continue; const ch = [...S.draft][c]; t.textContent = ch || ''; t.className = 'tile' + (ch ? ' f' : '') + (c === [...S.draft].length - 1 && k !== 'back' ? ' pop' : ''); }
  };
  document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => press(b.dataset.k));
  keyHandler = e => { if (!S.openDuel || e.metaKey || e.ctrlKey || e.altKey || document.querySelector('.ov')) return; const k = e.key.toLowerCase(); if (k === 'enter') { e.preventDefault(); press('enter'); } else if (k === 'backspace') press('back'); else if (/^[a-zäöüß]$/.test(k)) press(k === 'ß' ? 's' : k); };
  document.addEventListener('keydown', keyHandler);
}
async function submitWordless(d) {
  const g = S.draft;
  const shake = msg => { const r = $('#cur'); if (r) { r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); } toast(msg, 1); };
  if ([...g].length !== d.word_length) return shake('Zu wenige Buchstaben');

// ----- Schiffe versenken -----
const FLEET = [5, 4, 3, 3, 2];
function randomFleet() {
  for (let tries = 0; tries < 500; tries++) {
    const occ = new Set(), ships = []; let ok = true;
    for (const len of FLEET) {
      let placed = false;
      for (let t = 0; t < 200 && !placed; t++) {
        const hor = Math.random() < .5, x = Math.floor(Math.random() * (hor ? 11 - len : 10)), y = Math.floor(Math.random() * (hor ? 10 : 11 - len));
        const cells = Array.from({ length: len }, (_, i) => hor ? [x + i, y] : [x, y + i]);
        // Schiffe berühren sich nicht (auch nicht diagonal)
        if (cells.some(([cx, cy]) => [-1, 0, 1].some(dx => [-1, 0, 1].some(dy => occ.has((cx + dx) + ',' + (cy + dy)))))) continue;
        cells.forEach(c => occ.add(c.join(','))); ships.push(cells); placed = true;
      }
      if (!placed) { ok = false; break; }
    }
    if (ok) return ships;
  }
}
function grid(cellFn, clickable) {
  let h = '<div class="grid10">';
  for (let y = 0; y < 10; y++) for (let x = 0; x < 10; x++) { const c = cellFn(x, y); h += clickable && c.click ? `<button class="cell ${c.cls}" data-shot="${x},${y}" title="${'ABCDEFGHIJ'[x]}${y + 1}"></button>` : `<div class="cell ${c.cls}"></div>`; }
  return h + '</div>';
}
function bsHtml(d, me) {
  const st = d.state || {}; const B = S.bs || { boards: [], shots: [] };
  const opp = playersOf(d.id).find(p => p.user_id !== S.me.id)?.user_id;
  const myBoard = B.boards.find(b => b.user_id === S.me.id);
  const legend = '<div class="legend"><span><i style="background:#8e8e93"></i>Schiff</span><span><i style="background:#ff9f0a"></i>Treffer</span><span><i style="background:#ff3b30"></i>Versenkt</span><span><i style="background:var(--soft)"></i>Wasser</span></div>';
  if (st.phase === 'place' && d.status === 'open') {
    if (!me || me.status === 'invited') return '<div class="empty">Nimm die Einladung an, um deine Flotte zu platzieren.</div>';
    const ready = (st.ready || []).includes(S.me.id);
    if (ready) { const cells = new Set((myBoard?.ships || []).flat().map(c => c.join(','))); return `<div class="bst">⚓ Deine Flotte steht – warte auf ${esc(user(opp).display_name)} …</div>${grid((x, y) => ({ cls: cells.has(x + ',' + y) ? 'ship' : '' }))}${legend}`; }
    if (!S.bsDraft) S.bsDraft = randomFleet();
    const cells = new Set(S.bsDraft.flat().map(c => c.join(',')));
    return `<div class="bst">⚓ Platziere deine Flotte</div><p style="text-align:center;color:var(--mut);margin:0 0 12px;font-size:14px">5er, 4er, zwei 3er und ein 2er. Mische so oft du willst, dann „Bereit“.</p>${grid((x, y) => ({ cls: cells.has(x + ',' + y) ? 'ship' : '' }))}
      <div class="row" style="justify-content:center;margin-top:14px"><button class="btn sec" id="bshuf">🔀 Neu mischen</button><button class="btn" id="bready">✓ Bereit</button></div>`;
  }
  const myShots = B.shots.filter(s => s.shooter === S.me.id), oppShots = B.shots.filter(s => s.shooter !== S.me.id);
  const sunkSet = arr => new Set(arr.filter(s => s.sunk).flatMap(s => s.sunk.map(c => c.join(','))));
  const mySunk = sunkSet(myShots), oppSunk = sunkSet(oppShots);
  const myCells = new Set((myBoard?.ships || []).flat().map(c => c.join(',')));
  const last = B.shots[B.shots.length - 1];
  const oppBoard = B.boards.find(b => b.user_id === opp); const oppCells = new Set((oppBoard?.ships || []).flat().map(c => c.join(',')));
  const myTurnNow = d.status === 'open' && st.turn === S.me.id && me?.status === 'playing';
  const attack = grid((x, y) => { const k = x + ',' + y; const s = myShots.find(s => s.x === x && s.y === y);
    let cls = s ? (mySunk.has(k) ? 'sunk' : s.result === 'miss' ? 'miss' : 'hit') : (d.status !== 'open' && oppCells.has(k) ? 'ship' : '');
    if (last && last.shooter === S.me.id && last.x === x && last.y === y) cls += ' last';
    return { cls, click: myTurnNow && !s }; }, true);
  const def = grid((x, y) => { const k = x + ',' + y; const s = oppShots.find(s => s.x === x && s.y === y);
    let cls = s ? (oppSunk.has(k) ? 'sunk' : s.result === 'miss' ? 'miss' : 'hit') : myCells.has(k) ? 'ship' : '';
    if (last && last.shooter !== S.me.id && last.x === x && last.y === y) cls += ' last';
    return { cls }; });
  const hitsMe = myShots.filter(s => s.result !== 'miss').length, hitsOpp = oppShots.filter(s => s.result !== 'miss').length;
  const status = d.status !== 'open' ? '' : myTurnNow ? '<div class="banner info" style="text-align:center">🎯 Du bist dran – klick auf ein Feld beim Gegner. Bei Treffer darfst du nochmal!</div>' : `<div class="banner" style="background:var(--soft);text-align:center">⏳ ${esc(user(st.turn).display_name)} ist dran …</div>`;
  return `${status}<div class="bsw"><div><div class="bst">🎯 Gegner (${hitsMe}/17 Treffer)</div>${attack}</div><div><div class="bst">⚓ Deine Flotte (${hitsOpp}/17 getroffen)</div>${def}</div></div>${legend}`;
}
function bindBs(d, me) {
  const sh = $('#bshuf'); if (sh) sh.onclick = () => { S.bsDraft = randomFleet(); renderDuel(); };
  const rd = $('#bready'); if (rd) rd.onclick = async () => { rd.disabled = true; const { error } = await sb.rpc('bs_place', { p_duel: d.id, p_ships: S.bsDraft }); if (error) { toast(errMsg(error), 1); rd.disabled = false; return; } S.bsDraft = null; await loadAll(); renderDuel(); };

function chatMsgsHtml(id) {
  const ms = S.msgs.filter(m => (m.from_id === id && m.to_id === S.me.id) || (m.to_id === id && m.from_id === S.me.id));
  if (!ms.length) return `<div class="empty" style="margin:auto">Noch keine Nachrichten. Schreib ${esc(user(id).display_name.split(' ')[0])} die erste!</div>`;
  let out = '', lastDay = '';
  ms.forEach((m, i) => {
    const day = new Date(m.created_at).toLocaleDateString('de-AT', { weekday: 'short', day: '2-digit', month: '2-digit' });
    if (day !== lastDay) { out += `<div class="dsep">${day}</div>`; lastDay = day; }
    const mine = m.from_id === S.me.id;
    out += `<div class="bub ${mine ? 'me' : 'them'}">${esc(m.body)}</div>`;
    const nx = ms[i + 1];
    if (!nx || nx.from_id !== m.from_id || new Date(nx.created_at) - new Date(m.created_at) > 300000)
      out += `<div class="btime ${mine ? 'me' : ''}">${new Date(m.created_at).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' })}${mine && m === ms[ms.length - 1] ? (m.read_at ? ' · gelesen' : ' · gesendet') : ''}</div>`;
  });
  return out;
}
function convListHtml() {
  const L = convList();
  if (!L.length) return `<div class="empty" style="border:0">${S.cq ? 'Niemand gefunden.' : 'Noch keine Freunde. Füge im Tab „Freunde“ Leute hinzu.'}</div>`;
  return L.map(({ u, last }) => { const n = unreadFrom(u.id); return `<div class="citem ${S.chatWith === u.id ? 'on' : ''}" data-chat="${u.id}">${av(u.id)}<div style="flex:1;min-width:0"><b>${esc(u.display_name)}</b><div class="pv">${last ? (last.from_id === S.me.id ? 'Du: ' : '') + esc(last.body) : '@' + esc(u.username)}</div></div>${n ? `<span class="ubadge">${n}</span>` : ''}</div>`; }).join('');
}
function viewChat() {
  const w = S.chatWith && S.users.find(u => u.id === S.chatWith) ? S.chatWith : null;
  return {
    html: `<div class="h1">Nachrichten</div><div class="sub">Schreib direkt mit anderen Spielern – nur ihr beide könnt die Nachrichten lesen.</div>
    <div class="chat ${w ? 'open' : ''}"><div class="card clist"><div class="search"><input class="inp" id="csearch" placeholder="Freunde suchen …" value="${esc(S.cq)}" autocomplete="off"></div><div id="clist">${convListHtml()}</div></div>
    <div class="card cwin">${w ? `<div class="chead"><button class="btn sec sm" id="cback">←</button>${av(w)}<div style="flex:1"><b>${esc(user(w).display_name)}</b><div class="meta" style="font-size:12px;color:var(--mut)">@${esc(user(w).username)}</div></div>${isFriend(w) ? '<button class="btn sec sm" id="cduel">⚔️ Herausfordern</button>' : ''}</div>
      <div class="cmsgs" id="cmsgs">${chatMsgsHtml(w)}</div>
      ${isFriend(w) ? `<form class="cform" id="cf2"><textarea class="inp" id="ct" placeholder="Nachricht …" maxlength="2000">${esc(S.msgDraft[w] || '')}</textarea><button class="btn">Senden</button></form>` : '<div class="cform" style="color:var(--mut);font-size:14px;justify-content:center">Ihr seid nicht (mehr) befreundet – schreiben geht erst wieder als Freunde.</div>'}`
      : '<div class="empty" style="margin:auto;border:0">Wähle links eine Person aus.</div>'}</div></div>`,
    bind() {
      document.querySelectorAll('[data-chat]').forEach(c => c.onclick = () => { S.chatWith = c.dataset.chat; render(); });
      const cs = $('#csearch'); cs.oninput = () => { S.cq = cs.value; updateChat(); };
      if (!w) return;
      const box = $('#cmsgs'); box.scrollTop = box.scrollHeight;
      markRead(w);
      $('#cback').onclick = () => { S.chatWith = null; render(); };
      const cd = $('#cduel'); if (cd) cd.onclick = () => { S.newDuel.opp = new Set([w]); S.tab = 'new'; render(); };
      const t = $('#ct'); if (!t) return; t.oninput = () => { S.msgDraft[w] = t.value; t.style.height = '44px'; t.style.height = Math.min(120, t.scrollHeight) + 'px'; };
      t.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#cf2').requestSubmit(); } };
      if (matchMedia('(min-width:701px)').matches) t.focus();
      $('#cf2').onsubmit = async e => {
        e.preventDefault(); const body = t.value.trim(); if (!body || S.busy) return;
        S.busy = true; const { error } = await sb.rpc('send_message', { p_to: w, p_body: body }); S.busy = false;
        if (error) return toast(errMsg(error), 1);
        S.msgDraft[w] = ''; t.value = ''; t.style.height = '44px';
        await loadMsgs(); updateChat(); t.focus();
      };
    }
  };
}
function updateChat() {
  const w = S.chatWith; const box = $('#cmsgs'); const cl = $('#clist');
  if (cl) { cl.innerHTML = convListHtml(); cl.querySelectorAll('[data-chat]').forEach(c => c.onclick = () => { S.chatWith = c.dataset.chat; render(); }); }
  if (box && w) { const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80; box.innerHTML = chatMsgsHtml(w); if (atBottom) box.scrollTop = box.scrollHeight; markRead(w); }
  const tab = document.querySelector('[data-tab=chat]'); if (tab) tab.innerHTML = '<span class="l">Nachrichten</span><span class="s">💬</span>' + (unreadTotal() ? `<span class="dot">${unreadTotal()}</span>` : '');
}
async function markRead(w) {
  if (!S.msgs.some(m => m.from_id === w && m.to_id === S.me.id && !m.read_at)) return;
  S.msgs.forEach(m => { if (m.from_id === w && m.to_id === S.me.id && !m.read_at) m.read_at = new Date().toISOString(); });
  await sb.rpc('mark_read', { p_other: w });
  const tab = document.querySelector('[data-tab=chat]'); if (tab) tab.innerHTML = '<span class="l">Nachrichten</span><span class="s">💬</span>' + (unreadTotal() ? `<span class="dot">${unreadTotal()}</span>` : '');
}

// ===================== Dialoge =====================
function modal(html, bind) {
  const o = document.createElement('div'); o.className = 'ov'; o.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(o);
  const close = () => o.remove();
  o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) close(); });
  bind && bind(o, close); return close;
}
function confirmBox(text) {
  return new Promise(res => {
    modal(`<p style="font-size:16px;margin:0 0 18px">${esc(text)}</p><div class="row" style="justify-content:flex-end"><button class="btn sec" data-close id="no">Abbrechen</button><button class="btn" id="yes">OK</button></div>`,
      (m, close) => { m.querySelector('#yes').onclick = () => { close(); res(true); }; m.querySelector('#no').onclick = () => res(false); m.addEventListener('click', e => { if (e.target === m) res(false); }); });
  });
}
function changePw() {
  modal(`<h2>Passwort ändern</h2><label class="l">Neues Passwort (mind. 6 Zeichen)</label><input class="inp" id="p1" type="password" autocomplete="new-password"><label class="l">Wiederholen</label><input class="inp" id="p2" type="password" autocomplete="new-password">
    <div class="row" style="justify-content:flex-end;margin-top:18px"><button class="btn sec" data-close>Abbrechen</button><button class="btn" id="ps">Speichern</button></div>`, (m, close) => {
    m.querySelector('#ps').onclick = async () => {
      const a = m.querySelector('#p1').value, b = m.querySelector('#p2').value;
      if (a.length < 6) return toast('Mindestens 6 Zeichen', 1); if (a !== b) return toast('Passwörter stimmen nicht überein', 1);
      const { error } = await sb.auth.updateUser({ password: a }); if (error) return toast(errMsg(error), 1);
      toast('Passwort geändert ✓'); close();
    };
  });
}
function showHelp() {
  modal(`<h2>So funktioniert Wort-Duell</h2>
    <p class="mut">Wordless &amp; Clueless gegen deine Freunde – alle bekommen dasselbe geheime Wort, wer mit weniger Versuchen löst, gewinnt.</p>
    <h3>👥 Freunde</h3><p>Spielen und schreiben kannst du nur mit Freunden. Im Tab <b>Freunde</b> suchst du nach Name oder @benutzername (oder nimmst jemanden aus der Liste) und schickst eine Anfrage. Sobald die andere Person annimmt, seid ihr befreundet. Anfragen an dich erscheinen oben im Tab und als Hinweis oben rechts.</p>
    <h3>⚔️ Duell starten</h3><p>Unter <b>Neues Duell</b> wählst du das Spiel und hakst Freunde an. Die Eingeladenen sehen die Einladung sofort und nehmen an oder lehnen ab. Wordless/Clueless gehen auch allein als Übung (zählt nicht für die Rangliste).</p>
    <h3>🟩 Wordless</h3><p>Du hast 6 Versuche. Jeder Versuch muss ein echtes deutsches Wort mit der richtigen Länge sein.<br><b style="color:var(--grn)">Grün</b> = Buchstabe stimmt an dieser Stelle · <b style="color:#d49a00">Gelb</b> = Buchstabe kommt vor, aber woanders · <b style="color:var(--gry)">Grau</b> = kommt nicht vor. Tippen geht mit der Tastatur am Bildschirm oder am Computer.</p>
    <h3>🎯 Clueless</h3><p>Keine Buchstaben, keine Hinweise. Jedes Wort, das du eingibst, bekommt einen <b>Rang</b>: wie nah es von der <i>Bedeutung</i> her am geheimen Wort liegt. Rang 1 ist das Wort selbst, Rang 2 das ähnlichste usw. Starte mit breiten Begriffen („Tier“, „Essen“, „Gefühl“, „Ort“) und geh in die Richtung, in der die Zahl kleiner wird. Unbegrenzt viele Versuche – wenn's nicht klappt, kannst du aufgeben.</p>
    <h3>🎭 Wer bin ich?</h3><p>Ab 2 Spielern. Wer das Spiel erstellt, startet es, sobald alle angenommen haben. Jeder bekommt eine berühmte Person oder Figur – deine eigene siehst du nicht, die der anderen schon. Wer dran ist, stellt eine Ja/Nein-Frage. Alle anderen stimmen <b>RICHTIG</b> oder <b>FALSCH</b> ab – es zählt die Mehrheit (bei Gleichstand FALSCH). Bei RICHTIG darfst du nochmal fragen, bei FALSCH ist der Nächste dran. Mit „Lösen“ rätst du deinen Namen (kleine Tippfehler und nur der Nachname zählen auch). Falsch geraten = der Nächste ist dran. Gewonnen hat, wer zuerst richtig rät; die anderen spielen um die Plätze weiter.</p>
    <h3>🚢 Schiffe versenken</h3><p>Zu zweit. Beide platzieren ihre Flotte (5er, 4er, zwei 3er, 2er – mit „Neu mischen“ zufällig), dann „Bereit“. Wer beginnt, wird ausgelost. Klick auf ein Feld beim Gegner: <b>Wasser</b> = der andere ist dran, <b>Treffer</b> = du darfst nochmal. Wer zuerst alle 17 Schiffsfelder trifft, gewinnt.</p>
    <h3>👀 Live-Stand</h3><p>Rechts (am Handy oben) siehst du live, wie viele Versuche jeder hat und wer schon fertig ist – aber <b>nie, was die anderen eingeben</b>. Das Lösungswort wird erst angezeigt, wenn alle fertig sind.</p>
    <h3>🏆 Wer gewinnt?</h3><p>Wer das Wort mit den <b>wenigsten Versuchen</b> löst. Bei Gleichstand gewinnt, wer zuerst fertig war. Das Duell endet automatisch, wenn alle fertig sind oder abgelehnt haben. Wer das Duell erstellt hat, kann es auch vorzeitig beenden.</p>
    <h3>💬 Nachrichten</h3><p>Im Tab <b>Nachrichten</b> schreibst du direkt mit einem anderen Spieler – nur ihr beide seht den Chat. Neue Nachrichten erscheinen live und oben rechts als Hinweis, ungelesene zählt der rote Punkt. Mit der Suche findest du Freunde schnell. Enter sendet, Shift+Enter macht eine neue Zeile. Mit „⚔️ Herausfordern“ startest du direkt ein Duell gegen die Person, im Live-Stand eines Duells öffnet 💬 den Chat.</p>
    <h3>🏆 Punkte &amp; Ränge</h3><p>Für jedes beendete Duell mit mindestens zwei Spielern gibt's <b>+2 Punkte</b> fürs Mitspielen und <b>+20 Punkte</b> für den Sieg (+5 für jeden weiteren Gegner). Ränge: 🥉 Bronze (0) · 🥈 Silber (60) · 🥇 Gold (150) · 💠 Platin (300) · 💎 Diamant (500) · 👑 Meister (800) · 🔥 Legende (1200). Deinen Rang und den Fortschritt siehst du in der Rangliste und im Menü oben rechts.</p>
    <h3>🔑 Konto</h3><p>Accounts legt nur Luca (Admin) an. Dein Passwort änderst du über den runden Knopf oben rechts. Dort kannst du auch Browser-Benachrichtigungen für neue Einladungen einschalten.</p>
    ${S.profile?.is_admin ? `<h3>🛠 Admin</h3><p>Im Tab <b>Admin</b>: Account anlegen → die fertige Nachricht mit Link, Benutzername und Passwort kopieren oder per WhatsApp schicken. „Neues Passwort“ setzt ein vergessenes Passwort zurück. Die Wortdaten müssen nur einmal geladen werden.</p>` : ''}
    <p class="mut" style="margin-top:18px;font-size:13px">Wort-Duell · von Luca Kofler</p>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-close>Alles klar</button></div>`);
}

boot();
</script>
